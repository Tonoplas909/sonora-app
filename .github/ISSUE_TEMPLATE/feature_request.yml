name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the situation or the need first; the solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Sonora to do?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including how you work around it today, and whether a setting would be enough.
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this.
          required: false
